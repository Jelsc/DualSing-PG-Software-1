[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dualsign-ml"
version = "0.1.0"
description = "Offline landmark-sequence training and evaluation scaffold"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.1.3",
  "onnx==1.19.0",
  "onnxruntime==1.22.1",
  "onnxscript==0.4.0",
  "torch==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dualsign_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
